{% extends "base.html" %}

{% block content %}
<h1>Todos</h1>

<table border="1">
    <tr>
        <th>ID</th>
        <th>Title</th>
        <th>Status</th>
    </tr>

    {% for todo in todos %}
    <tr>
        <td>{{ todo.id }}</td>
        <td>{{ todo.title }}</td>
        <td>{{ "✅" if todo.completed else "❌" }}</td>
    </tr>
    {% endfor %}
</table>
{% endblock %}
